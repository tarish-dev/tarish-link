[package]
name = "tlink-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Capture the air and pull AWDL out of it."

[[bin]]
name = "tlink"
path = "src/main.rs"

[dependencies]
tlink = { path = "../tlink" }
tlink-hal = { path = "../tlink-hal" }
tlink-session = { path = "../tlink-session" }
log = { version = "0.4", features = ["std"] }
# Optional so the live-radio subcommands (beacon/tun/datapath) can cross-compile for
# Android, where libpcap is not in the NDK sysroot (`-lpcap` fails to link). The
# capture-file analysis subcommands need it; build with --no-default-features for the phone.
pcap = { version = "2", optional = true }

[features]
default = ["capture"]
capture = ["dep:pcap"]
