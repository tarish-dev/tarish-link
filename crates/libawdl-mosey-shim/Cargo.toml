[package]
name = "libawdl-mosey-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A drop-in libmosey_daemon_ffi ABI backed by libawdl + the wonder backend."

[lib]
# tarishd dlopens this by soname; it must be a C dynamic library exposing the mosey_* symbols.
name = "mosey_daemon_ffi"
crate-type = ["cdylib"]

[dependencies]
libawdl = { path = "../libawdl" }
libawdl-hal = { path = "../libawdl-hal" }
libawdl-session = { path = "../libawdl-session" }
log = "0.4"

# So the session's log output reaches logcat, and we can read persist.tarish.iface, when
# tarishd loads us on a phone.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
libc = "0.2"
